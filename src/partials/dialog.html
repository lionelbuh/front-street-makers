<dialog id="profile" class="profile">
  <div class="dialog-inner">
    <button id="profile-close" type="button" class="profile-close">Close</button>
    <div id="profile-body"></div>
    <nav id="profile-nav" class="profile-nav" aria-label="Browse stalls">
      <button id="profile-prev" type="button">← Previous stall</button>
      <span id="profile-pos"></span>
      <button id="profile-next" type="button">Next stall →</button>
    </nav>
  </div>
</dialog>
