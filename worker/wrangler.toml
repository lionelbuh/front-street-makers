# Cloudflare Worker for the Front Street Makers API.
# Setup steps: docs/SETUP.md
name = "front-street-makers-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://frontstreetmakers.com,https://www.frontstreetmakers.com"

[[d1_databases]]
binding = "DB"
database_name = "front-street-makers"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "front-street-makers-photos"

# Secrets (never in this file): set with
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
# Optional: TURNSTILE_SECRET, RESEND_API_KEY, NOTIFY_EMAIL, FROM_EMAIL
