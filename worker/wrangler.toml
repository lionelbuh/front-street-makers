# Cloudflare Worker for the Temecula Homegrown API.
# Setup steps: docs/SETUP.md
name = "temecula-homegrown-api"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
ALLOWED_ORIGINS = "https://temeculahomegrown.com,https://www.temeculahomegrown.com"

[[d1_databases]]
binding = "DB"
database_name = "temecula-homegrown"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "temecula-homegrown-photos"

# Secrets (never in this file): set with
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
# Optional: TURNSTILE_SECRET, RESEND_API_KEY, NOTIFY_EMAIL, FROM_EMAIL
